<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DomPass – Apartment Payment Management</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <img src="dompass-logo.png" alt="DomPass Logo" class="logo" />
    <nav>
      <a href="#contact" id="nav-contact">Contact</a>
      <a href="dompass-login/login.html" class="cta" id="nav-signin">Sign In</a>
      <a href="#signup" id="nav-signup">Sign Up</a>
      <select id="language-switcher">
        <option value="en">English</option>
        <option value="bg">Български</option>
      </select>
    </nav>
  </header>

  <section id="hero">
    <h1 id="hero-title">Welcome to DomPass</h1>
    <p id="hero-subtext">Smart, secure apartment payment management for your building.</p>
  </section>

  <section id="contact">
    <h2 id="contact-title">Contact Us</h2>
    <p id="contact-email">Email: upravitelblock225avhodb@gmail.com</p>
    <p id="contact-phone">Phone: +359 889 56 57 321</p>
  </section>

  <script>
    const translations = {
      en: {
        navContact: "Contact",
        navSignup: "Sign Up",
        navSignin: "Sign In",
        title: "Welcome to DomPass",
        subtext: "Smart, secure apartment payment management for your building.",
        contactTitle: "Contact Us",
        contactEmail: "Email: upravitelblock225avhodb@gmail.com",
        contactPhone: "Phone: +359 889 56 57 321"
      },
      bg: {
        navContact: "Контакти",
        navSignup: "Регистрация",
        navSignin: "Вход",
        title: "Добре дошли в DomPass",
        subtext: "Умно и сигурно управление на плащанията за вашата сграда.",
        contactTitle: "Свържете се с нас",
        contactEmail: "Имейл: upravitelblock225avhodb@gmail.com",
        contactPhone: "Телефон: +359 889 56 57 321"
      }
    };

    const switcher = document.getElementById("language-switcher");

    function applyLanguage(lang) {
      document.getElementById("nav-contact").textContent = translations[lang].navContact;
      document.getElementById("nav-signup").textContent = translations[lang].navSignup;
      document.getElementById("nav-signin").textContent = translations[lang].navSignin;
      document.getElementById("hero-title").textContent = translations[lang].title;
      document.getElementById("hero-subtext").textContent = translations[lang].subtext;
      document.getElementById("hero-button").textContent = translations[lang].button;
      document.getElementById("contact-title").textContent = translations[lang].contactTitle;
      document.getElementById("contact-email").textContent = translations[lang].contactEmail;
      document.getElementById("contact-phone").textContent = translations[lang].contactPhone;
    }

    const savedLang = localStorage.getItem("dompass-lang") || "en";
    switcher.value = savedLang;
    applyLanguage(savedLang);

    switcher.addEventListener("change", () => {
      const lang = switcher.value;
      localStorage.setItem("dompass-lang", lang);
      applyLanguage(lang);
    });
  </script>
</body>
</html>
