<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DomPass Sign Up</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>

  <!-- Firebase Config -->
  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "your-project.firebaseapp.com",
      projectId: "your-project-id",
      storageBucket: "your-project.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdefg"
    };

    firebase.initializeApp(firebaseConfig);
  </script>

  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
  <style>
    .password-wrapper {
      position: relative;
    }
    .toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 1.2em;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <img src="dompass-logo.png" alt="DomPass Logo" class="logo" />
    <h2 id="signup-title">Create Your DomPass Account</h2>
    <form>
      <input type="email" id="email" placeholder="Email" required />

      <div class="password-wrapper">
        <input type="password" id="password" placeholder="Password" required />
        <button type="button" class="toggle" onclick="toggleVisibility('password')">👁️</button>
      </div>

      <div class="password-wrapper">
        <input type="password" id="confirm-password" placeholder="Confirm Password" required />
        <button type="button" class="toggle" onclick="toggleVisibility('confirm-password')">👁️</button>
      </div>

      <button type="submit" id="signup-button">Sign Up</button>
    </form>
    <select id="language-switcher">
      <option value="en">English</option>
      <option value="bg">Български</option>
    </select>
  </div>

  <script>
    const translations = {
      en: {
        title: "Create Your DomPass Account",
        email: "Email",
        password: "Password",
        confirm: "Confirm Password",
        button: "Sign Up"
      },
      bg: {
        title: "Създай акаунт в DomPass",
        email: "Имейл",
        password: "Парола",
        confirm: "Потвърди парола",
        button: "Регистрация"
      }
    };

    const switcher = document.getElementById("language-switcher");

    function applyLang(lang) {
      document.getElementById("signup-title").textContent = translations[lang].title;
      document.getElementById("email").placeholder = translations[lang].email;
      document.getElementById("password").placeholder = translations[lang].password;
      document.getElementById("confirm-password").placeholder = translations[lang].confirm;
      document.getElementById("signup-button").textContent = translations[lang].button;
    }

    const savedLang = localStorage.getItem("dompass-lang") || "en";
    switcher.value = savedLang;
    applyLang(savedLang);

    switcher.addEventListener("change", () => {
      const lang = switcher.value;
      localStorage.setItem("dompass-lang", lang);
      applyLang(lang);
    });

    function toggleVisibility(id) {
      const input = document.getElementById(id);
      input.type = input.type === "password" ? "text" : "password";
    }

    const auth = firebase.auth();

    document.querySelector("form").addEventListener("submit", function(e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm-password").value;

      if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
      }

      auth.createUserWithEmailAndPassword(email, password)
        .then(user => {
          alert("Account created successfully!");
          window.location.href = "login.html";
        })
        .catch(error => {
          alert("Error: " + error.message);
        });
    });
  </script>
</body>
</html>
