<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DomPass Login</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-container">
    <img src="dompass-logo.png" alt="DomPass Logo" class="logo" />
    <h2 id="login-title">Log In to DomPass</h2>
    <form>
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit" id="login-button">Log In</button>
      <a href="#" id="forgot-link">Forgot your password?</a>
    </form>
    <select id="language-switcher">
      <option value="en">English</option>
      <option value="bg">Български</option>
    </select>
  </div>

  <script>
    const translations = {
      en: {
        title: "Log In to DomPass",
        email: "Email",
        password: "Password",
        button: "Log In",
        forgot: "Forgot your password?"
      },
      bg: {
        title: "Вход в DomPass",
        email: "Имейл",
        password: "Парола",
        button: "Вход",
        forgot: "Забравена парола?"
      }
    };

    const switcher = document.getElementById("language-switcher");

    function applyLang(lang) {
      document.getElementById("login-title").textContent = translations[lang].title;
      document.getElementById("email").placeholder = translations[lang].email;
      document.getElementById("password").placeholder = translations[lang].password;
      document.getElementById("login-button").textContent = translations[lang].button;
      document.getElementById("forgot-link").textContent = translations[lang].forgot;
    }

    const savedLang = localStorage.getItem("dompass-lang") || "en";
    switcher.value = savedLang;
    applyLang(savedLang);

    switcher.addEventListener("change", () => {
      const lang = switcher.value;
      localStorage.setItem("dompass-lang", lang);
      applyLang(lang);
    });
  </script>
</body>
</html>
